name: Compile v3.2
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          mkdir -p appsrc
          cat ci/v32_part_* | base64 -d > /tmp/project.zip
          unzip -q /tmp/project.zip -d appsrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        working-directory: appsrc
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: library-inventory-v32-debug
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
