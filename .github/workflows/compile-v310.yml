name: Compile library inventory v3.12 exact
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact v3.11 project
        run: |
          base64 -d v311-exact-source.b64 > v311-exact-source.zip
          unzip -t v311-exact-source.zip
          mkdir project
          unzip -q v311-exact-source.zip -d project
      - name: Apply v3.12 source patch
        shell: bash
        run: |
          cat v312p-00.txt v312p-01.txt v312p-02.txt v312p-03.txt | base64 -d | gzip -d > v312.patch
          cd project
          patch -p1 < ../v312.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        working-directory: project
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --console=plain > compile-console.log 2>&1
          status=$?
          tail -n 300 compile-console.log
          exit $status
      - name: Run Android lint
        working-directory: project
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --console=plain > lint-console.log 2>&1
          status=$?
          tail -n 240 lint-console.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-inventory-v312-exact-validation
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/reports/lint-results-debug.html
            project/app/build/reports/lint-results-debug.txt
            project/compile-console.log
            project/lint-console.log
